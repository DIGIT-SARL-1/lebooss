server {
    listen 80;
    listen [::]:80;

    server_name lebooss.com www.lebooss.com;
    root /var/www/lebooss.com/public_html;
    index index.html;

    access_log /var/log/nginx/lebooss.com.access.log;
    error_log /var/log/nginx/lebooss.com.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
